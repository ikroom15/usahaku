const STORAGE_KEY = 'kasirin_db_v1';
let DB = {
  business: null,
  products: [],
  suppliers: [],
  customers: [],
  sales: [],
  purchases: [],
  cash: [],
  stockMoves: [],

};
let currentView = 'dashboard';
let bluetoothChar = null;

/* ---------- Helpers ---------- */
const uid = (p='') => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const rp = n => 'Rp ' + (Number(n)||0).toLocaleString('id-ID');
const todayStr = () => new Date().toISOString().slice(0,10);
const nowStr = () => new Date().toLocaleString('id-ID');
const fmtDate = s => s ? new Date(s).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}) : '-';
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function loadDB(){
  try{ const r = localStorage.getItem(STORAGE_KEY); if(r) DB = {...DB, ...JSON.parse(r)}; }catch(e){}
}
function saveDB(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }

function findProduct(id){ return DB.products.find(p=>p.id===id); }
function productStock(id){
  return DB.stockMoves.filter(m=>m.productId===id).reduce((a,m)=>a + (m.type==='in'?m.qty:-m.qty), 0);
}
function productAvgCost(id){
  const moves = DB.stockMoves.filter(m=>m.productId===id);
  let qty=0,val=0;
  for(const m of moves){
    if(m.type==='in'){ qty+=m.qty; val += m.qty*m.cost; }
    else { if(qty>0){ const c=val/qty; qty-=m.qty; val-=m.qty*c; } }
  }
  return qty>0 ? val/qty : (findProduct(id)?.buyPrice||0);
}

function navigate(view){
  currentView = view;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const el = document.getElementById('view-'+view);
  if(el){ el.classList.add('active'); el.innerHTML = VIEWS[view](); }
  document.querySelectorAll('.nav-btn').forEach(b=>{
    const on = b.dataset.view===view;
    b.classList.toggle('bg-brand-50', on);
    b.classList.toggle('text-brand-700', on);
    b.classList.toggle('font-semibold', on);

/* ---------- Modal ---------- */
function openModal(title, bodyHTML, onOk, okLabel='Simpan'){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="fixed inset-0 bg-black/50 z-50 flex items-start justify-center p-4 overflow-y-auto" id="modalBg">
      <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg mt-10" id="modalBox">
        <div class="flex items-center justify-between p-4 border-b">
          <h3 class="font-semibold">${title}</h3>
          <button class="text-slate-400 hover:text-slate-700 text-xl" id="modalClose">×</button>
        </div>
        <div class="p-4 max-h-[70vh] overflow-y-auto">${bodyHTML}</div>
        <div class="p-4 border-t flex justify-end gap-2">
          <button id="modalCancel" class="px-4 py-2 rounded-lg border hover:bg-slate-50">Batal</button>
          <button id="modalOk" class="px-4 py-2 rounded-lg bg-brand-600 text-white hover:bg-brand-700">${okLabel}</button>
        </div>
      </div>
    </div>`;
  const close = () => root.innerHTML='';
  root.querySelector('#modalClose').onclick = close;
  root.querySelector('#modalCancel').onclick = close;
  root.querySelector('#modalOk').onclick = () => { if(onOk()!==false) close(); };
}

/* ---------- VIEWS ---------- */
const VIEWS = {};

/* === Dashboard === */
VIEWS.dashboard = () => {
  const today = todayStr();
  const salesToday = DB.sales.filter(s=>s.date.slice(0,10)===today);
  const revToday = salesToday.reduce((a,s)=>a+s.total,0);
  const profitToday = salesToday.reduce((a,s)=>a+(s.total - s.items.reduce((b,i)=>b+i.qty*i.cost,0)),0);
  const stockValue = DB.products.reduce((a,p)=>a + productStock(p.id)*productAvgCost(p.id), 0);
  const cashBalance = DB.cash.reduce((a,c)=>a + (c.type==='in'?c.amount:-c.amount), 0);

  const days = [...Array(7)].map((_,i)=>{
    const d = new Date(); d.setDate(d.getDate()-6+i);
    const key = d.toISOString().slice(0,10);
    const total = DB.sales.filter(s=>s.date.slice(0,10)===key).reduce((a,s)=>a+s.total,0);
    return { key, label: d.toLocaleDateString('id-ID',{day:'2-digit',month:'short'}), total };
  });
  const maxV = Math.max(...days.map(d=>d.total), 1);
  const recent = [...DB.sales.slice(-5)].reverse();

  return `
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      ${statCard('Penjualan Hari Ini', rp(revToday), '💰', 'bg-blue-50 text-blue-700')}
      ${statCard('Laba Hari Ini', rp(profitToday), '📈', 'bg-emerald-50 text-emerald-700')}
      ${statCard('Nilai Stok', rp(stockValue), '📦', 'bg-amber-50 text-amber-700')}
      ${statCard('Saldo Kas', rp(cashBalance), '💵', 'bg-purple-50 text-purple-700')}
    </div>

    <div class="grid lg:grid-cols-3 gap-4">
      <div class="lg:col-span-2 bg-white rounded-xl border p-4">
        <h3 class="font-semibold mb-4">Penjualan 7 Hari Terakhir</h3>
        <div class="flex items-end gap-2 h-40">
          ${days.map(d=>`
            <div class="flex-1 flex flex-col items-center justify-end gap-1">
              <div class="text-[10px] text-slate-500">${d.total>0?Math.round(d.total/1000)+'k':''}</div>
              <div class="w-full bg-brand-500 rounded-t" style="height:${(d.total/maxV)*100}%;min-height:2px"></div>
              <div class="text-[10px] text-slate-500">${d.label}</div>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="bg-white rounded-xl border p-4">
        <h3 class="font-semibold mb-3">Transaksi Terakhir</h3>
        ${recent.length? recent.map(s=>`
          <div class="flex justify-between items-center py-2 border-b last:border-0 text-sm">
            <div>
              <div class="font-medium">${esc(s.customer||'Umum')}</div>
              <div class="text-xs text-slate-500">${fmtDate(s.date)}</div>
            </div>
            <div class="font-semibold">${rp(s.total)}</div>
          </div>
        `).join('') : '<p class="text-sm text-slate-400">Belum ada transaksi</p>'}
      </div>
    </div>

    <div class="grid md:grid-cols-4 gap-4 mt-4">
      ${quickCard('Tambah Penjualan','💰','sales')}
      ${quickCard('Tambah Pembelian','🛍️','purchases')}
      ${quickCard('Tambah Barang','📦','products')}
      ${quickCard('Kalkulator HPP','🧮','hpp')}
    </div>
  `;
};

window.openProductForm = (id) => {
  const p = id ? findProduct(id) : {name:'',sku:'',category:'',unit:'pcs',buyPrice:0,sellPrice:0,minStock:0};
  openModal(id?'Edit Barang':'Tambah Barang', `
    <div class="grid grid-cols-2 gap-3">
      <div class="col-span-2"><label class="text-xs text-slate-500">Nama Barang *</label>
        <input id="p_name" value="${esc(p.name)}" class="w-full border rounded-lg px-3 py-2 mt-1"/></div>
      <div><label class="text-xs text-slate-500">SKU / Kode</label>
        <input id="p_sku" value="${esc(p.sku)}" class="w-full border rounded-lg px-3 py-2 mt-1"/></div>
      <div><label class="text-xs text-slate-500">Kategori</label>
        <input id="p_cat" value="${esc(p.category)}" class="w-full border rounded-lg px-3 py-2 mt-1"/></div>
      <div><label class="text-xs text-slate-500">Satuan</label>
        <input id="p_unit" value="${esc(p.unit)}" class="w-full border rounded-lg px-3 py-2 mt-1"/></div>
      <div><label class="text-xs text-slate-500">Stok Minimum</label>
        <input id="p_min" type="number" value="${p.minStock||0}" class="w-full border rounded-lg px-3 py-2 mt-1"/></div>
      <div><label class="text-xs text-slate-500">Harga Beli</label>
        <input id="p_buy" type="number" value="${p.buyPrice||0}" class="w-full border rounded-lg px-3 py-2 mt-1"/></div>
      <div><label class="text-xs text-slate-500">Harga Jual</label>
        <input id="p_sell" type="number" value="${p.sellPrice||0}" class="w-full border rounded-lg px-3 py-2 mt-1"/></div>
      ${!id? `<div class="col-span-2"><label class="text-xs text-slate-500">Stok Awal (opsional)</label>
        <input id="p_stock" type="number" value="0" class="w-full border rounded-lg px-3 py-2 mt-1"/>
        <p class="text-xs text-slate-400 mt-1">Stok awal akan dicatat sebagai mutasi masuk dengan harga = harga beli.</p></div>`:''}
    </div>
  `, ()=>{
    const name = document.getElementById('p_name').value.trim();
    if(!name) { alert('Nama wajib diisi'); return false; }
    const data = {
      name, sku:document.getElementById('p_sku').value.trim(),
      category:document.getElementById('p_cat').value.trim(),
      unit:document.getElementById('p_unit').value.trim()||'pcs',
      minStock:+document.getElementById('p_min').value||0,
      buyPrice:+document.getElementById('p_buy').value||0,
      sellPrice:+document.getElementById('p_sell').value||0,
    };
    if(id){ Object.assign(findProduct(id), data); }
    else {
      const newP = {id:uid('p_'), ...data};
      DB.products.push(newP);
      const initStok = +document.getElementById('p_stock').value||0;
      if(initStok>0){
        DB.stockMoves.push({id:uid('m_'),date:new Date().toISOString(),productId:newP.id,type:'in',qty:initStok,cost:data.buyPrice,note:'Stok awal',ref:''});
      }
    }
    saveDB(); navigate('products');
  });
};

window.deleteProduct = (id) => {
  if(!confirm('Hapus barang ini?')) return;
  DB.products = DB.products.filter(p=>p.id!==id);
  DB.stockMoves = DB.stockMoves.filter(m=>m.productId!==id);
  saveDB(); navigate('products');
};

/* ============================================================
   === HPP Calculator ===
   ============================================================ */

const UNIT_INFO = {
  kg:    { cat:'mass',   factor:1000, base:'gram' },
  gram:  { cat:'mass',   factor:1,    base:'gram' },
  ons:   { cat:'mass',   factor:100,  base:'gram' },
  liter: { cat:'volume', factor:1000, base:'ml' },
  ml:    { cat:'volume', factor:1,    base:'ml' },
  pcs:   { cat:'count',  factor:1,    base:'pcs' },
  pack:  { cat:'count',  factor:null, base:'pcs' }
};

function getUnitFactor(unit, packSize){
  const u = UNIT_INFO[unit];
  if(!u) return 1;
  if(unit === 'pack') return Math.max(1, +packSize || 1);
  return u.factor;
}
function getUnitCategory(unit){ return UNIT_INFO[unit]?.cat || 'count'; }
function getBaseUnitName(unit){ return UNIT_INFO[unit]?.base || 'pcs'; }
function getCompatibleUnits(unit){
  const cat = getUnitCategory(unit);
  if(cat === 'mass') return ['kg','gram','ons'];
  if(cat === 'volume') return ['liter','ml'];
  return ['pcs','pack'];
}

function getHPPIngredients(){
  const rows = document.querySelectorAll('#hpp_ingredients .hpp-ing-row');
  const list = [];
  rows.forEach(r => {
    const name = r.querySelector('.hpp-ing-name').value.trim();
    const price = +r.querySelector('.hpp-ing-price').value || 0;
    const unit = r.querySelector('.hpp-ing-unit').value;
    const packSize = +r.querySelector('.hpp-ing-packsize')?.value || 1;
    if(name) list.push({ name, price, unit, packSize });
  });
  return list;
}

function hppRefreshIngredientDropdowns(){
  const ings = getHPPIngredients();

  document.querySelectorAll('#hpp_usages .hpp-use-row').forEach(row => {
    const sel = row.querySelector('.hpp-use-ing');
    const cur = sel.value;
    sel.innerHTML = '<option value="">-- Pilih Bahan --</option>' +
      ings.map(i => `<option value="${esc(i.name)}">${esc(i.name)}</option>`).join('');
    if(cur && ings.some(i => i.name === cur)) sel.value = cur;
    else {
      sel.value = '';
      hppUpdateUsageUnitOptions(row, '');
    }
  });

  document.querySelectorAll('#hpp_ingredients .hpp-ing-row').forEach(row => {
    const name = row.querySelector('.hpp-ing-name').value.trim();
    const price = +row.querySelector('.hpp-ing-price').value || 0;
    const unit = row.querySelector('.hpp-ing-unit').value;
    const packSize = +row.querySelector('.hpp-ing-packsize')?.value || 1;
    const hintEl = row.querySelector('.hpp-ing-hint');
    if(hintEl && name && price > 0){
      const factor = getUnitFactor(unit, packSize);
      const perBase = price / factor;
      const baseName = getBaseUnitName(unit);
      let hint = `= ${rp(Math.round(perBase))} / ${baseName}`;
      if(unit === 'pack') hint = `1 pack = ${packSize} pcs → ${hint}`;
      hintEl.textContent = hint;
    } else if(hintEl){
      hintEl.textContent = '';
    }
  });
}

function hppUpdateUsageUnitOptions(row, ingName){
  const ings = getHPPIngredients();
  const ing = ings.find(i => i.name === ingName);
  const sel = row.querySelector('.hpp-use-unit');
  const cur = sel.value;
  if(!ing){
    sel.innerHTML = '<option value="">-</option>';
    return;
  }
  const opts = getCompatibleUnits(ing.unit);
  sel.innerHTML = opts.map(u => `<option value="${u}">${u}</option>`).join('');
  if(opts.includes(cur)) sel.value = cur;
  else sel.value = opts.includes(ing.unit) ? ing.unit : opts[opts.length-1];
}

function hppCalcSubtotal(ing, qty, unit){
  if(!ing || !qty || !unit) return 0;
  const ingFactor = getUnitFactor(ing.unit, ing.packSize);
  const useFactor = getUnitFactor(unit, ing.packSize);
  const basePrice = ing.price / ingFactor;
  return qty * useFactor * basePrice;
}

function hppRecalc(){
  const ings = getHPPIngredients();
  document.querySelectorAll('#hpp_usages .hpp-use-row').forEach(row => {
    const name = row.querySelector('.hpp-use-ing').value;
    const qty = +row.querySelector('.hpp-use-qty').value || 0;
    const unit = row.querySelector('.hpp-use-unit').value;
    const ing = ings.find(i => i.name === name);
    const sub = hppCalcSubtotal(ing, qty, unit);
    row.querySelector('.hpp-use-subtotal').textContent = sub > 0 ? rp(Math.round(sub)) : '-';
  });
  calcHPP();
}

window.hppRefreshAll = () => {
  hppRefreshIngredientDropdowns();
  hppRecalc();
};

window.calcHPP = () => {
  const ings = getHPPIngredients();
  let materialTotal = 0;
  document.querySelectorAll('#hpp_usages .hpp-use-row').forEach(row => {
    const name = row.querySelector('.hpp-use-ing').value;
    const qty = +row.querySelector('.hpp-use-qty').value || 0;
    const unit = row.querySelector('.hpp-use-unit').value;
    const ing = ings.find(i => i.name === name);
    materialTotal += hppCalcSubtotal(ing, qty, unit);
  });

  let overheadTotal = 0;
  document.querySelectorAll('#hpp_overhead .hpp-ov-row').forEach(r => {
    overheadTotal += +r.querySelector('.hpp-o-amount').value || 0;
  });

  const totalCost = materialTotal + overheadTotal;
  const batchEl = document.getElementById('hpp_batch');
  const marginEl = document.getElementById('hpp_margin');
  if(!batchEl || !marginEl) return;
  const batch = Math.max(1, +batchEl.value || 1);
  const margin = +marginEl.value || 0;
  const perUnit = totalCost / batch;
  const sellPrice = perUnit * (1 + margin/100);
  const profit = sellPrice - perUnit;

  document.getElementById('hpp_sum_material').textContent = rp(Math.round(materialTotal));
  document.getElementById('hpp_sum_overhead').textContent = rp(Math.round(overheadTotal));
  document.getElementById('hpp_sum_total').textContent = rp(Math.round(totalCost));
  document.getElementById('hpp_per_unit').textContent = rp(Math.round(perUnit));
  document.getElementById('hpp_sell').textContent = rp(Math.round(sellPrice));
  document.getElementById('hpp_profit').textContent = `Laba per unit: ${rp(Math.round(profit))} (${margin}%)`;
};

window.saveHPPAsProduct = () => {

  document.querySelectorAll('#hpp_usages .hpp-use-row').forEach(row => {
    const name = row.querySelector('.hpp-use-ing').value;

  });
  let overheadTotal = 0;
  document.querySelectorAll('#hpp_overhead .hpp-ov-row').forEach(r => {
    overheadTotal += +r.querySelector('.hpp-o-amount').value || 0;
  });

  const totalCost = materialTotal + overheadTotal;
  const batch = Math.max(1, +document.getElementById('hpp_batch').value || 1);
  const margin = +document.getElementById('hpp_margin').value || 0;
  const perUnit = totalCost / batch;
  const sellPrice = perUnit * (1 + margin/100);
  const name = document.getElementById('hpp_name').value.trim();

  if(totalCost <= 0){ alert('Total biaya masih 0. Isi bahan/overhead dulu.'); return; }

  const suggestedName = name || 'Produk HPP';

  openModal('Simpan sebagai Barang', `
    <div class="space-y-3">
      <div><label class="text-xs text-slate-500">Nama Barang *</label>
        <input id="sp_name" value="${esc(suggestedName)}" class="w-full border rounded-lg px-3 py-2 mt-1"/></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-xs text-slate-500">SKU</label>

        <div><label class="text-xs text-slate-500">Kategori</label>
          <input id="sp_cat" class="w-full border rounded-lg px-3 py-2 mt-1"/></div>
        <div><label class="text-xs text-slate-500">Satuan</label>
          <input id="sp_unit" value="pcs" class="w-full border rounded-lg px-3 py-2 mt-1"/></div>
        <div><label class="text-xs text-slate-500">Stok Awal</label>
          <input id="sp_stock" type="number" value="0" class="w-full border rounded-lg px-3 py-2 mt-1"/></div>
        <div><label class="text-xs text-slate-500">Harga Beli (HPP)</label>
          <input id="sp_buy" type="number" value="${Math.round(perUnit)}" class="w-full border rounded-lg px-3 py-2 mt-1"/></div>
        <div><label class="text-xs text-slate-500">Harga Jual</label>
          <input id="sp_sell" type="number" value="${Math.round(sellPrice)}" class="w-full border rounded-lg px-3 py-2 mt-1"/></div>
      </div>
      <div class="bg-slate-50 rounded-lg p-3 text-xs text-slate-600">
        HPP/unit: <b>${rp(Math.round(perUnit))}</b> · Harga jual: <b>${rp(Math.round(sellPrice))}</b> · Margin: <b>${margin}%</b>

    const stock = +document.getElementById('sp_stock').value||0;
    const buyPrice = +document.getElementById('sp_buy').value||0;
    const newP = {
      id: uid('p_'),
      name: nm,
      sku: document.getElementById('sp_sku').value.trim(),
      category: document.getElementById('sp_cat').value.trim(),
      unit: document.getElementById('sp_unit').value.trim()||'pcs',
      minStock: 0,
      buyPrice,
      sellPrice: +document.getElementById('sp_sell').value||0
    };
    DB.products.push(newP);
    if(stock>0){
      DB.stockMoves.push({
        id: uid('m_'), date: new Date().toISOString(),
        productId: newP.id, type:'in', qty:stock, cost:buyPrice,
        note:'Stok awal dari kalkulator HPP', ref:''
      });
    }
    saveDB();
    alert('Barang berhasil disimpan!');
    navigate('products');
  });
};

function recalcSale(){
  let sub = 0, hpp = 0;
  document.querySelectorAll('#sa_items > div').forEach(r=>{
    const pid = r.querySelector('.sa-prod').value;
    const q = +r.querySelector('.sa-qty').value||0;
    const p = +r.querySelector('.sa-price').value||0;
    sub += q*p;

  const totalEl = document.getElementById('sa_total');
  if(totalEl) totalEl.textContent = rp(total);

  if(hppEl) hppEl.textContent = `Estimasi HPP: ${rp(hpp)} • Laba kotor: ${rp(total-hpp)}`;

      items.push({productId:pid, name:p?.name||'', qty, price, cost:productAvgCost(pid)});
    }
  });
  return items;
}

function getReportData(from, to){
  const f = new Date(from).getTime(), t = new Date(to).getTime()+86400000;
  const sales = DB.sales.filter(s=>{const ts=new Date(s.date).getTime(); return ts>=f && ts<t;});
  const purchases = DB.purchases.filter(p=>{const ts=new Date(p.date).getTime(); return ts>=f && ts<t;});
  const cash = DB.cash.filter(c=>{const ts=new Date(c.date).getTime(); return ts>=f && ts<t;});
  const revenue = sales.reduce((a,s)=>a+s.total,0);
  const hpp = sales.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.qty*i.cost,0),0);
  const profit = revenue - hpp;
  const expenses = cash.filter(c=>c.type==='out').reduce((a,c)=>a+c.amount,0);
  const income = cash.filter(c=>c.type==='in').reduce((a,c)=>a+c.amount,0);
  const purchaseTotal = purchases.reduce((a,p)=>a+p.total,0);
  return {sales, purchases, cash, revenue, hpp, profit, expenses, income, purchaseTotal};
}

/* ---------- Bluetooth Printer ---------- */
window.connectBluetoothPrinter = async () => {
  if(!navigator.bluetooth){ alert('Browser tidak mendukung Bluetooth. Gunakan Chrome/Edge.'); return; }
  try {
    const device = await navigator.bluetooth.requestDevice({ acceptAllDevices:true, optionalServices:[
      '000018f0-0000-1000-8000-00805f9b34fb',
      '0000ff00-0000-1000-8000-00805f9b34fb',
      '49535343-fe7d-4ae5-8fa9-9fafd205e455',
      'e7810a71-73ae-499d-8c15-faa9aef0c3f2'
    ]});
    const server = await device.gatt.connect();
    const services = await server.getPrimaryServices();
    let char = null;
    for(const s of services){
      const chars = await s.getCharacteristics();
      for(const c of chars){
        if(c.properties.write || c.properties.writeWithoutResponse){ char = c; break; }
      }
      if(char) break;
    }
    if(!char){ alert('Printer ditemukan tapi tidak ada characteristic write.'); return; }
    bluetoothChar = char;
    alert('Printer terhubung: ' + (device.name||'Unknown'));
  } catch(e){ alert('Gagal: ' + e.message); }
};

async function btWrite(text){
  if(!bluetoothChar) return false;
  const enc = new TextEncoder();
  await bluetoothChar.writeValue(new Uint8Array([0x1B,0x40]));
  const bytes = enc.encode(text + '\n\n\n');
  for(let i=0;i<bytes.length;i+=100){
    await bluetoothChar.writeValue(bytes.slice(i, i+100));
    await new Promise(r=>setTimeout(r,20));
  }
  await bluetoothChar.writeValue(new Uint8Array([0x1D,0x56,0x00]));
  return true;
}
